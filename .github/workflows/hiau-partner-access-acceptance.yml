name: HIAU Partner Access Acceptance Gate
on:
  push:
    branches:
      - feat/staging-controlled-partner-resource-distribution-20261112
  pull_request:
    branches:
      - staging
      - feat/staging-partner-accounts-resource-review-20261112
    paths:
      - 'server/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/hiau-partner-access-acceptance.yml'
  workflow_dispatch:
jobs:
  partner-permissions:
    name: Partner permissions & authenticated distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build website and ERP
        run: npm run build
      - name: Run partner security and full session acceptance tests
        run: >
          node --import tsx --test --test-timeout=90000 --test-force-exit
          server/institutionalPartners.test.ts
          server/partnerCollaboration.test.ts
          server/partnerDistribution.test.ts
          server/partnerEvents.test.ts
          server/partnerAcceptance.test.ts
