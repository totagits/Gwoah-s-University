name: HIAU restoration validation
on:
  pull_request:
    branches: [staging]
    paths:
      - 'src/**'
      - 'server/**'
      - 'package*.json'
      - '.github/workflows/hiau-restore-check.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
