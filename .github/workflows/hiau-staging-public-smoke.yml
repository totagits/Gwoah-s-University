name: HIAU staging public smoke tests

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiau-staging-smoke
  cancel-in-progress: true

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify staging DNS, HTTPS, health and published video list
        shell: bash
        env:
          HIAU_STAGING_ORIGIN: https://hiau-staging.totag.network
        run: |
          set -euo pipefail
          echo "Checking DNS and HTTPS for staging (no application changes)"
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 12 \
              "${HIAU_STAGING_ORIGIN}/api/health" -o /tmp/hiau-health.json; then
              break
            fi
            echo "Staging not reachable yet: check ${attempt}/12"
            if [ "${attempt}" -eq 12 ]; then
              echo "::error::Staging health endpoint could not be reached over HTTPS."
              exit 1
            fi
            sleep 15
          done
          node -e "const f=require('fs'); const x=JSON.parse(f.readFileSync('/tmp/hiau-health.json','utf8')); if(x.status!=='ok') process.exit(1); console.log('Health:', x.status, 'version:', x.version)"
          curl --silent --show-error --fail --max-time 15 \
            "${HIAU_STAGING_ORIGIN}/api/public/hero-videos" -o /tmp/hiau-videos.json
          node -e "const f=require('fs'); const x=JSON.parse(f.readFileSync('/tmp/hiau-videos.json','utf8')); if(!Array.isArray(x.videos)||x.videos.length<2||x.videos[0].id!=='hero-campus'||x.videos[1].id!=='hero-classroom') {console.error('Missing original homepage videos'); process.exit(1);} if(x.videos.some(v=>typeof v.src!=='string'||!v.src.startsWith('/api/public/video/')))process.exit(1); console.log('Published homepage videos:',x.videos.length)"
          status=$(curl --silent --show-error --max-time 15 \
            -o /dev/null -w '%{http_code}' \
            "${HIAU_STAGING_ORIGIN}/api/admin/website-videos")
          if [ "$status" != 401 ] && [ "$status" != 403 ]; then
            echo "::error::Anonymous administrator listing returned HTTP $status (expected 401/403)"
            exit 1
          fi
          echo "Anonymous admin access correctly denied: HTTP $status"
          echo "Staging public smoke checks passed"
