<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4A1249" />
    <script>
      // Separate PWA identities: only the dedicated Student and Staff routes
      // expose install manifests. The public brochure itself is not an ERP app.
      (function () {
        var app = /^\/student(?:\/|$)/.test(location.pathname) ? 'student'
          : /^\/staff(?:\/|$)/.test(location.pathname) ? 'staff' : null;
        if (app) {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/' + app + '.webmanifest';
          document.head.appendChild(link);
          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) {
            appleIcon.href = '/hiau-' + app + '-180.png';
            appleIcon.sizes = '180x180';
          }
          document.title = app === 'student' ? 'HIAU Student App' : 'HIAU Staff ERP';
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HIAU" />
    <title>Harvest Intercontinental American University | HIAU Liberia</title>
    <meta name="description" content="Comprehensive university platform for Liberia featuring admissions, curriculum, academic planning, student portal, role-based ERP, institutional task management, and integrated analytics aligned with NCHE standards." />
    <meta property="og:title" content="Harvest Intercontinental American University ERP & Portal" />
    <meta property="og:description" content="Comprehensive university platform for Liberia featuring admissions, curriculum, academic planning, student portal, role-based ERP, institutional task management, and integrated analytics aligned with NCHE standards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
