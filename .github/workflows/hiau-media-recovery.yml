name: Restore HIAU original AI Studio media
on:
  push:
    branches: [fix/hiau-recover-original-aistudio-assets]
    paths: ['.github/workflows/hiau-media-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restore branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Checkout original main assets
        uses: actions/checkout@v4
        with:
          ref: main
          path: original-main
          persist-credentials: false
      - name: Find original assets and copy verified files
        shell: bash
        run: |
          set -euo pipefail
          echo "Original main media inventory:"
          find original-main/public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.mp4' \) | sed 's#^original-main/##' | head -100 || true
          mkdir -p public/assets/aistudio
          for name in image_20261105_121706_f720baa0.mp4 image_20261105_102657_b174d32f.mp4 image_bfcc4a11.png image_29eb5504.png image_51d124f3.png; do
            src="original-main/public/assets/aistudio/$name"
            if [ -s "$src" ]; then
              cp "$src" "public/assets/aistudio/$name"
              echo "Restored: $name ($(wc -c < "$src") bytes)"
            else
              echo "::warning::Not present in main: $name"
            fi
          done
          test -s public/assets/aistudio/image_20261105_121706_f720baa0.mp4
          test -s public/assets/aistudio/image_20261105_102657_b174d32f.mp4
          rm -rf original-main
      - name: Commit original binary media to recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/aistudio/
          if git diff --cached --quiet; then
            echo "No new media to commit"
          else
            git commit -m "assets(hiau): restore original media from AI Studio main"
            git push origin HEAD:fix/hiau-recover-original-aistudio-assets
          fi
